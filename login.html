<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Sistem Informasi KP FTI UNTAR</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Montserrat:wght@500;600&family=Poppins:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body data-shell="auth">
  <main class="auth">
    <form class="auth-card" id="login-form" novalidate>
      <div class="auth-card-head">
        <h1>LOGIN</h1>
        <a href="register.html">REGISTER</a>
      </div>
      <div class="field">
        <label class="sr-only" for="nim">Username</label>
        <input class="input" id="nim" name="nim" placeholder="Username" autocomplete="username" inputmode="numeric" required>
      </div>
      <div class="field input-wrap">
        <label class="sr-only" for="password">Password</label>
        <input class="input" id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="toggle-pass" type="button"></button>
      </div>
      <button class="btn btn-block" type="submit" disabled>Login</button>
    </form>
    <p class="auth-note">KPFTI Merupakan website untuk melakukan proses administrasi untuk program MBKM seperti Magang, Studi Independen, Mengajar di satuan pendidikan, dan Kewirausahaan, silahkan masukkan nim dan password untuk membuat akun KPFTI.</p>
  </main>
</body>
</html>
