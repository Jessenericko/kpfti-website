<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · Sistem Informasi KP FTI UNTAR</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Montserrat:wght@500;600&family=Poppins:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body data-shell="auth">
  <main class="auth">
    <form class="auth-card" id="register-form" novalidate>
      <div class="auth-card-head">
        <h1>Register</h1>
        <a href="login.html">LOGIN</a>
      </div>
      <div class="field">
        <label class="sr-only" for="jurusan">Jurusan</label>
        <select class="input" id="jurusan" name="jurusan" required>
          <option value="" selected disabled>Pilih Jurusan</option>
          <option>Teknik Informatika</option>
          <option>Sistem Informasi</option>
        </select>
      </div>
      <div class="field">
        <label class="sr-only" for="nim">Username (NIM)</label>
        <input class="input" id="nim" name="nim" placeholder="Username (NIM)" inputmode="numeric" pattern="\d{9}" title="NIM terdiri dari 9 angka" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="sr-only" for="nama">Nama</label>
        <input class="input" id="nama" name="nama" placeholder="Nama" autocomplete="name" required>
      </div>
      <div class="field">
        <label class="sr-only" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" placeholder="Masukkan Email" autocomplete="email" required>
      </div>
      <div class="field input-wrap">
        <label class="sr-only" for="password">Password</label>
        <input class="input" id="password" name="password" type="password" placeholder="Password" minlength="6" title="Minimal 6 karakter" autocomplete="new-password" required>
        <button class="toggle-pass" type="button"></button>
      </div>
      <button class="btn btn-block" type="submit" disabled>Register</button>
    </form>
    <p class="auth-note">KPFTI Merupakan website untuk melakukan proses administrasi untuk program MBKM seperti Magang, Studi Independen, Mengajar di satuan pendidikan, dan Kewirausahaan, silahkan masukkan nim dan password untuk membuat akun KPFTI.</p>
  </main>

  <div class="modal" id="register-failed" hidden>
    <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="register-failed-text">
      <button class="modal-close" type="button" data-close aria-label="Tutup">
        <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
      </button>
      <p id="register-failed-text">Tidak dapat mendaftarkan akun untuk saat ini.</p>
    </div>
  </div>
</body>
</html>
